<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Future Editorial Hero</title>
    <meta
      name="description"
      content="Treinamento para aprender a usar IA na gestão de redes sociais com método prático, estrutura clara e aplicação real."
    />
    <meta property="og:title" content="Future Editorial Hero" />
    <meta
      property="og:description"
      content="Treinamento para aprender a usar IA na gestão de redes sociais com método prático, estrutura clara e aplicação real."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Future Editorial Hero" />
    <meta
      name="twitter:description"
      content="Treinamento para aprender a usar IA na gestão de redes sociais com método prático, estrutura clara e aplicação real."
    />

    <style>
      :root {
        --bg: #efefed;
        --panel: rgba(255, 255, 255, 0.6);
        --ink: #0d0d0d;
        --muted: #626262;
        --line: rgba(15, 15, 15, 0.08);
        --line-strong: rgba(15, 15, 15, 0.14);
        --card: rgba(255, 255, 255, 0.34);
        --shadow: 0 20px 80px rgba(0, 0, 0, 0.08);
        --radius: 26px;
        --max-width: 1240px;
      }

      *, *::before, *::after {
        box-sizing: border-box;
      }

      html {
        scroll-behavior: smooth;
        background-color: #000000;
      }

      body {
        margin: 0;
        min-height: 100vh;
        color: #0d0d0d;
        font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
        background: radial-gradient(circle at top left, rgba(255, 255, 255, 0.9), transparent 32%),
                    linear-gradient(180deg, #f5f5f3 0%, #ebebe8 100%);
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        overflow-x: hidden;
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      .page-shell {
        min-height: 100vh;
        width: 100%;
        position: relative;
      }

      /* ==========================================================================
         UTILITIES & BUTTONS
         ========================================================================== */
      .button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 48px;
        padding: 0 22px;
        border-radius: 12px;
        font-size: 0.84rem;
        font-weight: 500;
        cursor: pointer;
        transition: transform 180ms cubic-bezier(0.16, 1, 0.3, 1),
                    box-shadow 180ms cubic-bezier(0.16, 1, 0.3, 1),
                    background-color 180ms ease,
                    border-color 180ms ease;
        text-align: center;
        border: none;
        outline: none;
      }

      .button:hover,
      .button:focus-visible {
        transform: translateY(-1px);
      }

      .button--primary {
        min-height: 60px;
        padding: 0 38px;
        background: linear-gradient(180deg, #202020 0%, #050505 100%);
        color: #ffffff;
        border: 1px solid rgba(255, 255, 255, 0.18);
        box-shadow: 0 18px 48px rgba(0, 0, 0, 0.18);
        font-size: 0.98rem;
        font-weight: 600;
        letter-spacing: 0.01em;
      }

      .button--primary:hover,
      .button--primary:focus-visible {
        box-shadow: 0 22px 54px rgba(0, 0, 0, 0.28);
        border-color: rgba(255, 255, 255, 0.28);
      }

      .button--comparison {
        background: #f4f4f1;
        color: #111111;
        min-height: 56px;
        padding: 0 36px;
        border-radius: 12px;
        font-size: 0.96rem;
        font-weight: 600;
        letter-spacing: 0.01em;
        border: 1px solid rgba(255, 255, 255, 0.9);
        box-shadow: 0 16px 40px rgba(0, 0, 0, 0.25);
      }

      .button--comparison:hover,
      .button--comparison:focus-visible {
        background: #ffffff;
        box-shadow: 0 20px 48px rgba(0, 0, 0, 0.35);
      }

      .button--offer {
        min-width: 320px;
        min-height: 62px;
        padding: 0 36px;
        background: linear-gradient(180deg, #ffffff 0%, #e9e9e4 100%);
        color: #0d0d0d;
        border-radius: 14px;
        font-size: 0.9rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        border: 1px solid #ffffff;
        box-shadow: 0 18px 48px rgba(0, 0, 0, 0.35);
      }

      .button--offer:hover,
      .button--offer:focus-visible {
        background: linear-gradient(180deg, #ffffff 0%, #f6f6f2 100%);
        box-shadow: 0 24px 56px rgba(0, 0, 0, 0.45);
      }

      /* ==========================================================================
         SCROLL REVEALS & WORD-BY-WORD
         ========================================================================== */
      .reveal-media {
        opacity: 0;
        transform: translateY(46px) scale(0.96);
        filter: blur(18px);
        transition: opacity 900ms cubic-bezier(0.16, 1, 0.3, 1),
                    transform 1100ms cubic-bezier(0.16, 1, 0.3, 1),
                    filter 1100ms cubic-bezier(0.16, 1, 0.3, 1);
        will-change: transform, opacity, filter;
      }

      .reveal-side {
        opacity: 0;
        transform: translateX(48px);
        filter: blur(10px);
        transition: opacity 850ms cubic-bezier(0.16, 1, 0.3, 1),
                    transform 950ms cubic-bezier(0.16, 1, 0.3, 1),
                    filter 950ms cubic-bezier(0.16, 1, 0.3, 1);
        will-change: transform, opacity, filter;
      }

      .reveal-up {
        opacity: 0;
        transform: translateY(52px);
        filter: blur(10px);
        transition: opacity 800ms cubic-bezier(0.16, 1, 0.3, 1),
                    transform 950ms cubic-bezier(0.16, 1, 0.3, 1),
                    filter 950ms cubic-bezier(0.16, 1, 0.3, 1);
        will-change: transform, opacity, filter;
      }

      .reveal-mark {
        opacity: 0;
        transform: translateY(18px);
        filter: blur(10px);
        transition: opacity 600ms cubic-bezier(0.16, 1, 0.3, 1),
                    transform 700ms cubic-bezier(0.16, 1, 0.3, 1),
                    filter 700ms cubic-bezier(0.16, 1, 0.3, 1);
        will-change: transform, opacity, filter;
      }

      .reveal-media.is-visible,
      .reveal-side.is-visible,
      .reveal-up.is-visible,
      .reveal-mark.is-visible {
        opacity: 1;
        transform: none;
        filter: blur(0px);
      }

      .reveal-word {
        display: inline-block;
        opacity: 0;
        transform: translateY(12px);
        filter: blur(8px);
        transition: opacity 500ms cubic-bezier(0.16, 1, 0.3, 1),
                    transform 700ms cubic-bezier(0.16, 1, 0.3, 1),
                    filter 700ms cubic-bezier(0.16, 1, 0.3, 1);
        transition-delay: calc(var(--word-index, 0) * 45ms);
        will-change: transform, opacity, filter;
      }

      .reveal-write.is-visible .reveal-word {
        opacity: 1;
        transform: translateY(0);
        filter: blur(0px);
      }

      .reveal-write--delay .reveal-word {
        transition-delay: calc(180ms + (var(--word-index, 0) * 45ms));
      }

      /* Sections base */
      .section-dark {
        background-color: #000000;
        color: #f3f3f1;
        position: relative;
        overflow: hidden;
      }

      .section-light {
        background-color: #f5f4f0;
        color: #101010;
        position: relative;
        overflow: hidden;
      }

      /* ==========================================================================
         SECTION 1: VIDEO HERO
         ========================================================================== */
      .hero {
        position: relative;
        overflow: hidden;
        padding: 56px 48px 0;
        isolation: isolate;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }

      .hero--card-banner {
        position: relative;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 64px 32px;
        background-color: #171415;
        overflow: hidden;
      }

      .hero__canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 0;
        display: block;
      }

      .hero__ambient-glow {
        position: absolute;
        inset: 0;
        background: radial-gradient(circle at 50% 50%, rgba(55, 48, 50, 0.45) 0%, rgba(18, 15, 16, 0.82) 75%, #121011 100%);
        pointer-events: none;
        z-index: 1;
      }

      .hero__card-wrap {
        position: relative;
        z-index: 2;
        width: 100%;
        max-width: 1032px;
        display: flex;
        align-items: center;
        justify-content: center;
        filter: drop-shadow(0 30px 80px rgba(0, 0, 0, 0.85));
        animation: heroCardFloat 7s ease-in-out infinite;
      }

      @keyframes heroCardFloat {
        0%, 100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-8px);
        }
      }

      .hero__card-img {
        width: 100%;
        height: auto;
        max-height: 80vh;
        object-fit: contain;
        border-radius: 20px;
        display: block;
        box-shadow: 0 24px 70px rgba(0, 0, 0, 0.65), 0 0 45px rgba(255, 255, 255, 0.04);
        border: 1px solid rgba(255, 255, 255, 0.14);
      }

      .hero__media {
        position: absolute;
        inset: 0;
        overflow: hidden;
        z-index: 0;
        background-color: #e5e5e3;
        pointer-events: none;
        user-select: none;
      }

      .hero__video {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center top;
        pointer-events: none;
        user-select: none;
        border: none;
      }

      .hero__video::-webkit-media-controls {
        display: none !important;
      }

      .hero__video--desktop {
        display: block;
      }

      .hero__video--mobile {
        display: none;
      }

      .hero__grid {
        position: relative;
        z-index: 1;
        width: min(100%, 1240px);
        margin: 0 auto;
        display: grid;
        grid-template-columns: 1fr;
        align-items: start;
        padding-top: 12px;
      }

      .hero__title {
        margin: 14px 0 0 42px;
        max-width: 860px;
        font-size: clamp(3.15rem, 5.85vw, 5.55rem);
        line-height: 0.96;
        letter-spacing: -0.05em;
        font-weight: 300;
        text-transform: uppercase;
        text-align: left;
        color: #0d0d0d;
      }

      .hero__title span {
        display: inline-block;
        white-space: nowrap;
      }

      .hero__subtitle {
        margin: 24px 0 0 42px;
        max-width: 560px;
        color: #4f4f4f;
        font-size: 1.02rem;
        line-height: 1.9;
        font-weight: 400;
      }

      .hero__actions {
        margin: 28px 0 0 42px;
        display: flex;
        align-items: center;
      }

      .hero__line {
        position: relative;
        z-index: 1;
        width: min(100%, 1240px);
        margin: 42px auto 0;
        height: 64px;
        flex-shrink: 0;
      }

      .hero__line::before {
        content: '';
        position: absolute;
        inset: 0;
        background: rgba(128, 128, 128, 0.11);
        clip-path: polygon(0 62%, 39% 62%, 48% 0, 100% 0, 100% 25%, 52% 25%, 43% 98%, 0 98%);
      }

      /* ==========================================================================
         SECTION 2: ABOUT / CHAOS BLOCK
         ========================================================================== */
      .about-block {
        padding: 88px 48px;
        border-top: 1px solid rgba(255, 255, 255, 0.06);
      }

      .about-block__inner {
        width: min(100%, 1240px);
        margin: 0 auto;
        display: grid;
        grid-template-columns: minmax(0, 1.08fr) minmax(360px, 480px);
        align-items: center;
        gap: 72px;
      }

      .about-block__media {
        position: relative;
        margin: 0;
        padding: 0;
        overflow: hidden;
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .about-block__media img {
        width: 100%;
        height: auto;
        object-fit: cover;
        display: block;
        animation: aboutFloat 8s ease-in-out infinite;
      }

      .about-block__media::after {
        content: '';
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 38%;
        background: linear-gradient(to top, #000000 0%, transparent 100%);
        pointer-events: none;
        opacity: 1;
        transition: opacity 1.1s cubic-bezier(0.16, 1, 0.3, 1);
      }

      .about-block__media.is-visible::after {
        opacity: 0;
      }

      @keyframes aboutFloat {
        0%, 100% {
          transform: translateY(0) scale(1);
        }
        50% {
          transform: translateY(-10px) scale(1.012);
        }
      }

      .about-block__content {
        max-width: 480px;
      }

      .about-block__title {
        font-size: clamp(3.65rem, 6.3vw, 5.6rem);
        line-height: 0.96;
        letter-spacing: -0.055em;
        font-weight: 300;
        text-transform: uppercase;
        margin: 26px 0 0;
        color: #f3f3f1;
      }

      .about-block__tags {
        display: flex;
        flex-wrap: wrap;
        gap: 16px;
        margin-top: 34px;
      }

      .about-block__tags .tag {
        display: inline-flex;
        align-items: center;
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 999px;
        min-height: 34px;
        padding: 0 16px;
        font-size: 0.88rem;
        color: rgba(255, 255, 255, 0.7);
        letter-spacing: 0.01em;
        background: rgba(255, 255, 255, 0.02);
      }

      .about-block__copy {
        max-width: 410px;
        color: rgba(255, 255, 255, 0.52);
        font-size: 1rem;
        line-height: 1.9;
        margin: 24px 0 0;
      }

      /* ==========================================================================
         SECTION 3: SERVICES / BENEFITS
         ========================================================================== */
      .services-block {
        padding: 64px 48px 108px;
        border-top: 1px solid rgba(255, 255, 255, 0.05);
      }

      .services-block__header {
        text-align: center;
        max-width: 980px;
        margin: 0 auto;
      }

      .services-block__title {
        font-size: clamp(2.95rem, 5.4vw, 4.7rem);
        line-height: 0.98;
        letter-spacing: -0.055em;
        font-weight: 300;
        text-transform: uppercase;
        margin: 0;
        color: #f3f3f1;
      }

      .services-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 28px;
        margin-top: 64px;
        max-width: 1240px;
        margin-left: auto;
        margin-right: auto;
      }

      .service-card {
        min-height: 360px;
        padding: 36px 34px 30px;
        border-radius: 24px;
        background: #171717;
        border: 1px solid rgba(255, 255, 255, 0.04);
        text-align: center;
        display: flex;
        flex-direction: column;
        align-items: center;
        transition: transform 240ms cubic-bezier(0.16, 1, 0.3, 1),
                    border-color 240ms cubic-bezier(0.16, 1, 0.3, 1),
                    box-shadow 240ms cubic-bezier(0.16, 1, 0.3, 1);
      }

      .service-card:hover {
        transform: translateY(-8px);
        border-color: rgba(255, 255, 255, 0.12);
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.6);
      }

      .service-card:nth-child(1) { transition-delay: 0ms; }
      .service-card:nth-child(2) { transition-delay: 180ms; }
      .service-card:nth-child(3) { transition-delay: 360ms; }

      .service-card__icon-holder {
        width: 54px;
        height: 54px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.09);
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
        flex-shrink: 0;
      }

      /* Headset Icon */
      .icon-headset {
        width: 22px;
        height: 18px;
        border: 2px solid #ffffff;
        border-bottom: none;
        border-radius: 12px 12px 0 0;
        position: relative;
      }
      .icon-headset::before,
      .icon-headset::after {
        content: '';
        position: absolute;
        bottom: -2px;
        width: 5px;
        height: 9px;
        background: #ffffff;
        border-radius: 2px;
      }
      .icon-headset::before { left: -3px; }
      .icon-headset::after { right: -3px; }

      /* Play / Assistant Circle Icon */
      .icon-assistant {
        width: 0;
        height: 0;
        border-top: 7px solid transparent;
        border-bottom: 7px solid transparent;
        border-left: 12px solid #ffffff;
        margin-left: 3px;
      }

      /* Screen / Device Icon */
      .icon-screen {
        width: 24px;
        height: 16px;
        border: 2px solid #ffffff;
        border-radius: 3px;
        position: relative;
      }
      .icon-screen::after {
        content: '';
        position: absolute;
        bottom: -6px;
        left: 50%;
        transform: translateX(-50%);
        width: 10px;
        height: 2px;
        background: #ffffff;
        box-shadow: 0 -2px 0 0 #ffffff;
      }

      .service-card__title {
        margin: 42px 0 16px;
        font-size: 1.9rem;
        font-weight: 400;
        color: #ffffff;
        letter-spacing: -0.02em;
      }

      .service-card__copy {
        max-width: 280px;
        margin: 0;
        color: rgba(255, 255, 255, 0.42);
        line-height: 1.95;
        font-size: 0.95rem;
      }

      /* ==========================================================================
         SECTION 4: COMPARISON
         ========================================================================== */
      .comparison-block {
        padding: 44px 48px 120px;
        border-top: 1px solid rgba(255, 255, 255, 0.05);
      }

      .comparison-block__header {
        text-align: center;
        max-width: 980px;
        margin: 0 auto;
      }

      .comparison-block__title {
        font-size: clamp(3.2rem, 6vw, 5rem);
        line-height: 0.98;
        letter-spacing: -0.055em;
        font-weight: 300;
        text-transform: uppercase;
        margin: 0;
        color: #f3f3f1;
      }

      .comparison-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 28px;
        margin-top: 52px;
        max-width: 1240px;
        margin-left: auto;
        margin-right: auto;
      }

      .comparison-card {
        border-radius: 24px;
        padding: 44px 42px 28px;
      }

      .comparison-card--negative {
        background: linear-gradient(180deg, rgba(25, 25, 25, 0.7) 0%, rgba(12, 12, 12, 0.9) 100%);
        border: 1px solid rgba(255, 255, 255, 0.08);
      }

      .comparison-card--positive {
        background: #f5f5f2;
        border: 1px solid rgba(255, 255, 255, 0.92);
        color: #111111;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
      }

      .comparison-card__title {
        font-size: 2rem;
        line-height: 1.05;
        font-weight: 300;
        letter-spacing: -0.03em;
        margin: 0 0 28px;
      }

      .comparison-card--negative .comparison-card__title {
        color: rgba(255, 255, 255, 0.78);
      }

      .comparison-card--positive .comparison-card__title {
        color: #111111;
      }

      .comparison-list {
        list-style: none;
        margin: 0;
        padding: 0;
      }

      .comparison-list__item {
        min-height: 72px;
        padding-left: 36px;
        display: flex;
        align-items: center;
        position: relative;
        font-size: 1.05rem;
      }

      .comparison-card--negative .comparison-list__item {
        border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        color: rgba(255, 255, 255, 0.6);
      }

      .comparison-card--negative .comparison-list__item:last-child {
        border-bottom: none;
      }

      .comparison-card--negative .comparison-list__item::before {
        content: '×';
        position: absolute;
        left: 0;
        font-size: 1.5rem;
        color: #ff5252;
        font-weight: 300;
        line-height: 1;
      }

      .comparison-card--positive .comparison-list__item {
        border-bottom: 1px solid rgba(0, 0, 0, 0.07);
        color: #111111;
        font-weight: 500;
      }

      .comparison-card--positive .comparison-list__item:last-child {
        border-bottom: none;
      }

      .comparison-card--positive .comparison-list__item::before {
        content: '✓';
        position: absolute;
        left: 0;
        font-size: 1.2rem;
        color: #111111;
        font-weight: 600;
        line-height: 1;
      }

      .comparison-block__action {
        text-align: center;
        margin-top: 40px;
      }

      /* ==========================================================================
         SECTION 5: QUOTE METHOD BLOCK
         ========================================================================== */
      .quote-block {
        padding: 10px 48px 128px;
        border-top: 1px solid rgba(255, 255, 255, 0.05);
      }

      .quote-panel {
        width: min(100%, 980px);
        margin: 0 auto;
        padding: 44px 56px 40px;
        border: 1px solid rgba(255, 255, 255, 0.06);
        background: linear-gradient(180deg, rgba(20, 20, 20, 0.6) 0%, rgba(10, 10, 10, 0.8) 100%);
        text-align: center;
        border-radius: 24px;
        position: relative;
        overflow: hidden;
      }

      .quote-panel::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        width: 120px;
        height: 120px;
        border-top: 1px solid rgba(255, 255, 255, 0.2);
        border-left: 1px solid rgba(255, 255, 255, 0.2);
        pointer-events: none;
      }

      .quote-panel::after {
        content: '';
        position: absolute;
        bottom: 0;
        right: 0;
        width: 120px;
        height: 120px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.2);
        border-right: 1px solid rgba(255, 255, 255, 0.2);
        pointer-events: none;
      }

      .quote-panel__text {
        max-width: 760px;
        margin: 0 auto;
        color: #f3ecde;
        font-size: clamp(2.25rem, 4.6vw, 4rem);
        line-height: 1.02;
        letter-spacing: -0.045em;
        font-weight: 300;
      }

      .quote-panel__text em {
        font-style: italic;
        color: #dfc19a;
      }

      .quote-panel__meta {
        max-width: 620px;
        margin: 24px auto 0;
        color: rgba(255, 255, 255, 0.58);
        font-size: 1.12rem;
        line-height: 1.85;
      }

      /* ==========================================================================
         SECTION 6: DELIVERABLES
         ========================================================================== */
      .deliverables-block {
        padding: 84px 48px 118px;
      }

      .deliverables-block__header {
        max-width: 1240px;
        margin: 0 auto;
      }

      .deliverables-block__title {
        max-width: 520px;
        font-size: clamp(3.1rem, 5.8vw, 4.9rem);
        line-height: 0.98;
        letter-spacing: -0.055em;
        font-weight: 300;
        text-transform: uppercase;
        margin: 0;
        color: #101010;
      }

    <div class="page-shell">
      <!-- =======================================================================

      <section class="hero hero--card-banner" id="hero">
        <canvas id="hero-geo-canvas" class="hero__canvas" aria-hidden="true"></canvas>
        <div class="hero__ambient-glow" aria-hidden="true"></div>
        <div class="hero__card-wrap reveal-media">
          <img
            class="hero__card-img"
            src="https://i.postimg.cc/W4mmSPty/cartao-fabio-dalbosco-sem-whatsapp(1).png"

    <!-- =======================================================================
         VANILLA JAVASCRIPT
         ======================================================================= -->
    <script>
      (function () {
        document.documentElement.classList.add('is-ready');

        /* 1. Hero Videos Autoplay Resilience */
        function initHeroVideos() {
          const videos = document.querySelectorAll('.hero__video');
          videos.forEach(function (video) {
            video.muted = true;
            video.defaultMuted = true;
            video.playsInline = true;
            video.loop = true;
            video.autoplay = true;
            video.removeAttribute('controls');

            if ('disableRemotePlayback' in video) {
              video.disableRemotePlayback = true;
            }

            function safePlay() {
              if (video.paused) {
                const playPromise = video.play();
                if (playPromise !== undefined) {
                  playPromise.catch(function () {});
                }
              }
            }

            video.addEventListener('loadeddata', safePlay);
            video.addEventListener('pause', safePlay);
            video.addEventListener('ended', safePlay);

            ['visibilitychange', 'pageshow', 'focus', 'touchstart', 'touchend', 'click'].forEach(function (evt) {
              window.addEventListener(evt, safePlay, { passive: true });
            });
          });

          let retries = 0;
          const retryInterval = setInterval(function () {
            retries++;
            videos.forEach(function (video) {
              if (video.paused) {
                const playPromise = video.play();
                if (playPromise !== undefined) {
                  playPromise.catch(function () {});
                }
              }
            });
            if (retries >= 20) {
              clearInterval(retryInterval);
            }
          }, 1200);
        }

        /* 2. Word-by-word quote reveal */
        function prepareWordReveal() {
          const writeElements = document.querySelectorAll('.reveal-write');
          writeElements.forEach(function (element) {
            let wordIndex = 0;

            function processNode(node) {
              if (node.nodeType === Node.TEXT_NODE) {
                const text = node.textContent;
                const tokens = text.split(/(\s+)/);
                const fragment = document.createDocumentFragment();

                tokens.forEach(function (token) {
                  if (!token) return;
                  if (/^\s+$/.test(token)) {
                    fragment.appendChild(document.createTextNode(token));
                  } else {
                    const span = document.createElement('span');
                    span.className = 'reveal-word';
                    span.style.setProperty('--word-index', wordIndex);
                    span.textContent = token;
                    fragment.appendChild(span);
                    wordIndex++;
                  }
                });

                node.replaceWith(fragment);
              } else if (node.nodeType === Node.ELEMENT_NODE) {
                Array.from(node.childNodes).forEach(function (child) {
                  processNode(child);
                });
              }
            }

            Array.from(element.childNodes).forEach(function (child) {
              processNode(child);
            });
          });
        }

        /* 3. Intersection Observer Scroll Reveals */
        function initScrollReveals() {
          const targets = document.querySelectorAll(
            '.reveal-media, .reveal-side, .reveal-up, .reveal-mark, .reveal-write'
          );

          if (!('IntersectionObserver' in window)) {
            targets.forEach(function (el) {
              el.classList.add('is-visible');
            });
            return;
          }

          const observer = new IntersectionObserver(
            function (entries) {
              entries.forEach(function (entry) {
                if (entry.isIntersecting) {
                  entry.target.classList.add('is-visible');
                  observer.unobserve(entry.target);
                }
              });
            },
            {
              threshold: 0.22,
              rootMargin: '0px 0px -8% 0px',
            }
          );

          targets.forEach(function (target) {
            observer.observe(target);
          });
        }

        /* 4. FAQ Accordion (Single-open) */
        function initFaqAccordion() {
          const triggers = document.querySelectorAll('.faq-item__trigger');
          triggers.forEach(function (btn) {
            btn.addEventListener('click', function () {
              const isExpanded = btn.getAttribute('aria-expanded') === 'true';
              // Close all answers
              triggers.forEach(function (otherBtn) {
                otherBtn.setAttribute('aria-expanded', 'false');
                const targetId = otherBtn.getAttribute('aria-controls');
                const ans = targetId ? document.getElementById(targetId) : null;
                if (ans) ans.hidden = true;
              });

              // Toggle selected
              if (!isExpanded) {
                btn.setAttribute('aria-expanded', 'true');
                const targetId = btn.getAttribute('aria-controls');
                const ans = targetId ? document.getElementById(targetId) : null;
                if (ans) ans.hidden = false;
              }
            });
          });
        }

        /* 5. Hero Geometric Background (Faceted Mesh matching the card's left tab) */
        function initHeroGeometricCanvas() {
          const canvas = document.getElementById('hero-geo-canvas');
          if (!canvas) return;
          const ctx = canvas.getContext('2d');
          if (!ctx) return;

          let width = 0;
          let height = 0;
          const dpr = Math.min(window.devicePixelRatio || 1, 2);
          const cellSize = 78;
          let cols = 0;
          let rows = 0;
          let points = [];
          let triangles = [];

          function resize() {
            const parent = canvas.parentElement;
            if (!parent) return;
            const rect = parent.getBoundingClientRect();
            width = rect.width;
            height = rect.height;
            canvas.width = Math.floor(width * dpr);
            canvas.height = Math.floor(height * dpr);
            ctx.setTransform(1, 0, 0, 1, 0, 0);
            ctx.scale(dpr, dpr);

            cols = Math.ceil(width / cellSize) + 3;
            rows = Math.ceil(height / (cellSize * 0.866)) + 3;

            points = [];
            triangles = [];

            for (let r = 0; r <= rows; r++) {
              for (let c = 0; c <= cols; c++) {
                const baseX = (c - 1 + (r % 2) * 0.5) * cellSize;
                const baseY = (r - 1) * (cellSize * 0.866);
                const randSeed = Math.sin(c * 12.9898 + r * 78.233) * 43758.5453;
                const jitterX = ((randSeed % 1) - 0.5) * (cellSize * 0.42);
                const randSeed2 = Math.cos(c * 39.34 + r * 19.87) * 43758.5453;
                const jitterY = ((randSeed2 % 1) - 0.5) * (cellSize * 0.35);

                points.push({
                  c: c,
                  r: r,
                  baseX: baseX + jitterX,
                  baseY: baseY + jitterY,
                  phase: c * 0.45 + r * 0.55,
                  amp: 30 + ((randSeed2 % 1) * 25),
                  x: 0,
                  y: 0,
                  z: 0
                });
              }
            }

            for (let r = 0; r < rows; r++) {
              for (let c = 0; c < cols; c++) {
                const idx = r * (cols + 1) + c;
                const nextRowIdx = (r + 1) * (cols + 1) + c;

                if (r % 2 === 0) {
                  triangles.push([idx, nextRowIdx, nextRowIdx + 1]);
                  triangles.push([idx, nextRowIdx + 1, idx + 1]);
                } else {
                  triangles.push([idx, nextRowIdx, idx + 1]);
                  triangles.push([idx + 1, nextRowIdx, nextRowIdx + 1]);
                }
              }
            }
          }

          window.addEventListener('resize', resize);
          resize();

          let targetMouseX = 0;
          let targetMouseY = 0;
          let mouseX = 0;
          let mouseY = 0;

          window.addEventListener('mousemove', function (e) {
            targetMouseX = (e.clientX / window.innerWidth - 0.5) * 35;
            targetMouseY = (e.clientY / window.innerHeight - 0.5) * 35;
          }, { passive: true });

          const startTime = performance.now();

          function animate(now) {
            const t = now - startTime;
            mouseX += (targetMouseX - mouseX) * 0.05;
            mouseY += (targetMouseY - mouseY) * 0.05;

            ctx.clearRect(0, 0, width, height);

            for (let i = 0; i < points.length; i++) {
              const p = points[i];
              const w1 = Math.sin(t * 0.0011 + p.phase);
              const w2 = Math.cos(t * 0.0008 + p.c * 0.38 - p.r * 0.3);
              const w3 = Math.sin(t * 0.0015 + (p.c + p.r) * 0.25);

              p.x = p.baseX + w2 * 7 + mouseX * 0.2;
              p.y = p.baseY + w1 * 7 + mouseY * 0.2;
              p.z = (w1 * 0.5 + w2 * 0.3 + w3 * 0.2) * p.amp;
            }

            const lx = -0.35 + mouseX * 0.01;
            const ly = -0.55 + mouseY * 0.01;
            const lz = 0.75;
            const lLen = Math.sqrt(lx * lx + ly * ly + lz * lz) || 1;
            const nlx = lx / lLen;
            const nly = ly / lLen;
            const nlz = lz / lLen;

            for (let i = 0; i < triangles.length; i++) {
              const tri = triangles[i];
              const pA = points[tri[0]];
              const pB = points[tri[1]];
              const pC = points[tri[2]];

              if (!pA || !pB || !pC) continue;

              const abX = pB.x - pA.x;
              const abY = pB.y - pA.y;
              const abZ = pB.z - pA.z;

              const acX = pC.x - pA.x;
              const acY = pC.y - pA.y;
              const acZ = pC.z - pA.z;

              const nx = abY * acZ - abZ * acY;
              const ny = abZ * acX - abX * acZ;
              const nz = abX * acY - abY * acX;

              const nLen = Math.sqrt(nx * nx + ny * ny + nz * nz) || 1;
              const normX = nx / nLen;
              const normY = ny / nLen;
              const normZ = nz / nLen;

              const dot = normX * nlx + normY * nly + normZ * nlz;
              const diff = Math.max(0, Math.min(1, (dot + 0.2) / 1.2));
              const spec = Math.pow(diff, 4.5);

              const r = Math.floor(22 + diff * 62 + spec * 75);
              const g = Math.floor(19 + diff * 56 + spec * 70);
              const b = Math.floor(20 + diff * 58 + spec * 72);

              ctx.beginPath();
              ctx.moveTo(pA.x, pA.y);
              ctx.lineTo(pB.x, pB.y);
              ctx.lineTo(pC.x, pC.y);
              ctx.closePath();

              ctx.fillStyle = 'rgb(' + r + ',' + g + ',' + b + ')';
              ctx.fill();

              const edgeAlpha = (0.05 + diff * 0.16 + spec * 0.3).toFixed(3);
              ctx.strokeStyle = 'rgba(255, 255, 255, ' + edgeAlpha + ')';
              ctx.lineWidth = 0.65;
              ctx.stroke();
            }

            requestAnimationFrame(animate);
          }

          requestAnimationFrame(animate);
        }

        /* Initialize Everything on DOMContentLoaded */
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', function () {
            prepareWordReveal();
            initHeroVideos();
            initScrollReveals();
            initFaqAccordion();
            initHeroGeometricCanvas();
          });
        } else {
          prepareWordReveal();
          initHeroVideos();
          initScrollReveals();
          initFaqAccordion();
          initHeroGeometricCanvas();
        }
      })();
    </script>
  </body>
</html>
